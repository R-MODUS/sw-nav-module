# Standalone Neato LDS driver (not an R-MODUS module).
# TF mount and the UI name (lidar.name) belong in the robot profile.
# This package only publishes LaserScan with header.frame_id.
#
# Více kusů: neato_lidar.items (každá položka vlastní topic, port, frame_id).
# name je ROS node name (písmena, čísla, _), ne popisek v UI.
neato_lidar:
  enabled: true
  topic: /scan
  frame_id: lidar_beam
  port: /dev/ttyUSB0
  motor_pin: 19
  frequency: 10000
  target_rpm: 300
  range_min: 0.05
  range_max: 5.0
  angle_min: 0.0
  angle_max: 6.283185307179586
