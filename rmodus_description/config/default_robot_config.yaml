# Shared robot / sensor model (description + EKF merge).
# Optional HW modules (bumper/cliff/flow/display/uart) have their own package defaults;
# bringup robot.yaml overrides the same keys under /**/ros__parameters.

/**:
  ros__parameters:

    base_link:
      mass: 5.0
      size: [0.5, 0.5, 0.1]
      offset_z: 0.0973
      nav_offset_x: 0.032
      nav_offset_z: 0.0

    nav_module:
      offset_x: 0.032
      offset_z: 0.0

    wheel_odom:
      enabled: true
      type: 'odom'
      topic: '/odom'

    lidar_odom:
      enabled: false
      type: 'odom'
      topic: '/odom_lidar'

    imu:
      enabled: true
      type: 'imu'
      name: 'imu'
      topic: '/imu/data'
      frame_id: 'imu_link'
      mount_parent_frame: 'main_module_mount'
      mount_offset: [0.0, 0.0, 0.0]
      mount_rpy: [0.0, 0.0, 0.0]
      offset: [0.056, 0.020, 0.015]
      rpy: [0.0, 0.0, 0.0]

    lidar:
      enabled: true
      name: 'lidar'
      topic: '/scan'
      frame_id: 'lidar_beam'
      mount_parent_frame: 'main_module_mount'
      mount_offset: [0.0, 0.0, 0.0]
      mount_rpy: [0.0, 0.0, 0.0]
      offset: [0.005, 0.0, 0.2]
      rpy: [0.0, 0.0, 0.0]

    flow_sensor:
      enabled: true
      type: 'twist'
      topic: '/visual_flow/data'
      frame_id: 'flow_front_link'
      mount_parent_frame: 'base_link'
      mount_offset: [0.3, 0.0, 0.0]
      mount_rpy: [0.0, 0.0, 0.0]

    uart_output:
      enabled: true
      port: '/dev/ttyUSB0'
      baudrate: 115200
      cmd_vel_topic: '/cmd_vel_safe'

    bumpers:
      enabled: true
      items: []

    cliff_sensors:
      enabled: true
      items: []

    display:
      enabled: false

    fan:
      enabled: true
      fan_pin: 13
      frequency: 10
      min_to_run: 0.25
      user_power: [0.0, 0.5, 1.0]
