# ROS default profil R-MODUS (bringup + parametry modulů).
# Kanonický tvar bringup: + /** musí sedět s:
#   sw-install/examples/rmodus-example.yaml
# Example = meta + boot.rmodus + web + stejný obsah jako tento soubor.
# Runtime: ~/rmodus/configs/profiles/<active>.yaml (ukazatel configs/active)
# Síť:     ~/rmodus/configs/network.yaml
#
# Spouštění řídí top-level bringup:; druhá vrstva je *.enabled v blocích níže.
# Těžké / feature balíčky jsou optional — chybí-li na disku, launch je přeskočí s logem.

bringup:
  config: true           # rmodus_config: profile CRUD services
  chassis: true          # false = cizí host už publikuje base_link
  description: true      # sada: rmodus_mount + imu/lidar TF
  hw: true
  uart_output: false     # legacy UART cmd_vel výstup; pohon řeší drive (chassis)
  estop: true            # false = cmd_mux bez zámku (test bez stopky)
  cmd_mux: true          # twist_mux (optional deb): teleop > web > nav → /cmd_vel
  bumper: true           # optional package rmodus_bumper
  cliff: true            # optional package rmodus_cliff_sensor
  flow: true             # optional package rmodus_flow_sensor
  display: true          # optional package rmodus_display
  web: true
  rviz: false
  sim: false             # optional rmodus_gazebo + ros_gz_* (zatím nespouští stack)
  localization: true     # rmodus_localization (EKF; rf2o/slam optional debs)
  navigation: true       # rmodus_navigation (Nav2 optional debs)
  slam: true             # slam_toolbox (optional deb)
  rf2o: false            # rf2o_laser_odometry (optional deb)
  obstacle_cloud: true
  microros: true         # jeden micro_ros_agent na každou položku v microros.items
  # Vlastní / third-party launch. enabled: false = nespoustet, definice zustava.
  # Chybí-li package nebo soubor → skip + log. args "$robot_yaml" → tento profil.
  extras: []
  # extras:
  #   - enabled: true
  #     package: neato_lidar
  #     launch: neato_lidar.launch.py
  #     args:
  #       config_file: $robot_yaml
  #   - enabled: false
  #     path: /home/robot/extra.launch.py

# Jedna deska = jedna položka. device je seriový port ESP. Firmware bumperů: 115200.
microros:
  enabled: true
  items:
    - name: bumpers
      enabled: true
      transport: serial
      device: /dev/ttyACM0
      baudrate: 115200
    # Driver unit pohonu. Víc ESP = stabilní cesty /dev/serial/by-id/... místo ttyACM*.
    - name: drive
      enabled: false
      transport: serial
      device: /dev/ttyACM1
      baudrate: 115200

# Volitelný blok web: — pokud chybí, rmodus_web použije package default.
# Plný web: je v profiles/*.yaml (example).

/**:
  ros__parameters:

    base_link:
      mass: 5.0
      size: [0.5, 0.5, 0.1]
      offset_z: 0.0973

    # Pohon (host): /cmd_vel → kinematika → rychlosti kol [rad/s] na driver units.
    # Spouští se s bringup.chassis. Unit = ESP s N kanály (PID + enkodéry), kinematiku nezná.
    #   cmd_topic   std_msgs/Float32MultiArray  rad/s na kanál (index = channel), 20 Hz, nuly po timeoutu
    #   state_topic std_msgs/Int32MultiArray    kumulativní tiky na kanál; "" = unit bez zpětné vazby
    # /odom jen když wheel_odom.enabled a kola mají zpětnou vazbu (ticks_per_rev > 0).
    # mode: diff2 (wheel_l, wheel_r) | diff4 / mecanum (wheel_fl, wheel_fr, wheel_rl, wheel_rr)
    drive:
      enabled: true
      mode: mecanum
      wheel_radius: 0.05       # m
      track_width: 0.38        # m, vzdálenost levé a pravé řady kol (u diff4 efektivní)
      wheelbase: 0.24          # m, přední–zadní náprava (mecanum)
      max_wheel_speed: 10.0    # rad/s; nad limitem se zpomalí všechna kola poměrově
      cmd_timeout_sec: 0.5
      joint_states: true
      units:
        - name: main
          cmd_topic: /drive/main/cmd
          state_topic: /drive/main/state
      wheels:
        - { name: wheel_fl, unit: main, channel: 0, invert: false, ticks_per_rev: 1440 }
        - { name: wheel_fr, unit: main, channel: 1, invert: true,  ticks_per_rev: 1440 }
        - { name: wheel_rl, unit: main, channel: 2, invert: false, ticks_per_rev: 1440 }
        - { name: wheel_rr, unit: main, channel: 3, invert: true,  ticks_per_rev: 1440 }

    rmodus_module:
      mass: 2.0
      size: [0.25, 0.25, 0.05]
      offset_x: 0.032
      offset_y: 0.0
      offset_z: 0.02

    wheel_odom:
      enabled: true
      type: 'odom'
      topic: '/odom'

    lidar_odom:
      enabled: false
      type: 'odom'
      topic: '/odom_lidar'

    # Lidar/IMU: kontrakt (topic + TF). Driver spouští uživatel mimo bringup.
    imu:
      enabled: true
      type: 'imu'
      topic: '/imu/data'
      frame_id: 'imu_link'
      mount_parent_frame: 'rmodus_mount'
      mount_offset: [0.0, 0.0, 0.0]
      mount_rpy: [0.0, 0.0, 0.0]
      offset: [0.056, 0.020, 0.015]
      rpy: [0.0, 0.0, 0.0]

    lidar:
      enabled: true
      topic: '/scan'
      frame_id: 'lidar_beam'
      mount_parent_frame: 'rmodus_mount'
      mount_offset: [0.0, 0.0, 0.0]
      mount_rpy: [0.0, 0.0, 0.0]
      offset: [0.005, 0.0, 0.2]
      rpy: [0.0, 0.0, 0.0]

    # Rychlost: zdroje publikují na <zdroj>/cmd_vel, twist_mux vybere podle priority
    # a výstup jde na /cmd_vel (to žere host: uart_output nebo cizí podvozek).
    # Nikdo jiný než mux na /cmd_vel publikovat nesmí.
    # Zámek e_stop (priorita 255) blokuje vše pod 255; estop vstup (255) posílá nuly.
    cmd_mux:
      enabled: true
      use_stamped: false        # Twist; musí sedět s web.cmd.use_twist_stamped
      output_topic: /cmd_vel
      inputs:
        - name: estop
          topic: /estop/cmd_vel
          priority: 255
          timeout: 0.5
        - name: teleop           # gamepad / klávesnice (teleop_twist_*)
          topic: /teleop/cmd_vel
          priority: 100
          timeout: 0.5
        - name: web
          topic: /web/cmd_vel
          priority: 90
          timeout: 0.5
        - name: nav              # Nav2 velocity_smoother
          topic: /nav/cmd_vel
          priority: 10
          timeout: 0.5
      locks:
        - name: e_stop           # bez zprávy déle než timeout = zamčeno
          topic: /rmodus/e_stop
          priority: 255
          timeout: 0.5

    uart_output:
      enabled: true
      port: '/dev/ttyUSB0'
      baudrate: 115200
      cmd_vel_topic: '/cmd_vel'
      cmd_timeout_sec: 0.5      # bez příkazu → nuly na UART

    rmodus_estop:
      enabled: true
      publish_rate_hz: 50.0
      zero_cmd_topic: /estop/cmd_vel
      state_topic: /rmodus/e_stop
      request_topic: /rmodus/e_stop/request
      reset_topic: /rmodus/e_stop/reset
      hw_active_topic: /rmodus/e_stop/hw_active
      gpio_button:
        enabled: false
        pin: 16
      platform:
        enabled: false

    flow_sensor:
      enabled: true
      type: 'twist'
      topic: '/visual_flow/data'
      frame_id: 'flow_front_link'
      mount_parent_frame: 'base_link'
      mount_offset: [0.3, 0.0, 0.0]
      mount_rpy: [0.0, 0.0, 0.0]
      spi_port: 0
      spi_cs: 0
      deadzone: 3
      timer_period: 0.05
      z_height: 0.025
      fov_deg: 42.0
      res_pix: 35

    bumpers:
      enabled: true
      state_topic: /robot/bumpers/state
      estop_request:
        enabled: true
        request_topic: /rmodus/e_stop/request
        retrigger_while_contact: false
      items:
        - name: 'front'
          enabled: true
          pin: 0
          topic: '/bumper/front'
          frame_id: 'bumper_front_contact'
          mount_parent_frame: 'base_link'
          mount_offset: [0.30, 0.0, 0.0]
          mount_rpy: [0.0, 0.0, 0.0]
          size: [0.02, 0.30, 0.05]
          contact_offset: [0.02, 0.0, -0.025]
          contact_rpy: [0.0, 0.0, 0.0]

    cliff_sensors:
      enabled: true
      address: '0x48'
      estop_request:
        enabled: true
        request_topic: /rmodus/e_stop/request
        cliff_range_threshold_m: 0.12
        retrigger_while_cliff: false
      items:
        - name: 'fl'
          enabled: true
          topic: '/cliff/fl'
          frame_id: 'cliff_sensor_fl_beam'
          pin: 0
          mount_parent_frame: 'base_link'
          mount_offset: [0.25, 0.20, 0.0]
          mount_rpy: [0.0, 0.0, 0.0]
          size: [0.02, 0.02, 0.02]
          beam_offset: [0.0, 0.0, -0.01]
          beam_rpy: [0.0, 1.5708, 0.0]
        - name: 'fr'
          enabled: true
          topic: '/cliff/fr'
          frame_id: 'cliff_sensor_fr_beam'
          pin: 1
          mount_parent_frame: 'base_link'
          mount_offset: [0.25, -0.20, 0.0]
          mount_rpy: [0.0, 0.0, 0.0]
          size: [0.02, 0.02, 0.02]
          beam_offset: [0.0, 0.0, -0.01]
          beam_rpy: [0.0, 1.5708, 0.0]

    display:
      enabled: true
      address: '0x3C'
      width: 128
      height: 32
      orientation: 0
      brightness: 5
      frame_id: 'display_link'
      mount_parent_frame: 'rmodus_mount'
      mount_offset: [0.0, 0.0, 0.0]
      mount_rpy: [0.0, 0.0, 0.0]

    fan:
      enabled: true
      fan_pin: 13
      frequency: 10
      min_to_run: 0.25
      user_power: [0.0, 0.5, 1.0]
