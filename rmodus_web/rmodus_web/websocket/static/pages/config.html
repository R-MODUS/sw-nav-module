<div class="page-shell">
    <div class="page-head">
        <div>
            <h1 class="page-title">Profily</h1>
            <p class="page-subtitle">Správa robot profilů v <code id="profiles-root-label">~/rmodus/configs</code>.</p>
        </div>
        <div class="btn-row">
            <button type="button" class="btn btn-secondary" id="profiles-refresh-btn">Obnovit</button>
            <button type="button" class="btn btn-primary" id="profiles-create-btn">Nový profil</button>
        </div>
    </div>

    <div class="profiles-layout">
        <aside class="panel panel-pad profiles-sidebar stack">
            <h3>Seznam</h3>
            <div id="profiles-list" class="surface-list"></div>
        </aside>

        <section class="panel panel-pad config-view stack">
            <div class="profiles-editor-head">
                <div>
                    <h2 id="profiles-editor-title">Vyber profil</h2>
                    <p class="page-subtitle" id="profiles-editor-path"></p>
                </div>
                <div class="btn-row profiles-actions" id="profiles-actions">
                    <button type="button" class="btn btn-secondary" id="profiles-edit-btn" disabled>Upravit</button>
                    <button type="button" class="btn btn-primary" id="profiles-save-btn" hidden disabled>Uložit</button>
                    <button type="button" class="btn btn-secondary" id="profiles-cancel-btn" hidden disabled>Zrušit</button>
                    <button type="button" class="btn btn-secondary" id="profiles-activate-btn" disabled>Aktivovat</button>
                    <div class="profiles-more" id="profiles-more">
                        <button type="button" class="btn btn-secondary profiles-more-toggle" id="profiles-more-btn" disabled aria-haspopup="true" aria-expanded="false" title="Další akce">⋯</button>
                        <div class="profiles-more-menu" id="profiles-more-menu" hidden role="menu">
                            <button type="button" class="profiles-more-item" id="profiles-download-btn" role="menuitem">Stáhnout</button>
                            <button type="button" class="profiles-more-item profiles-more-danger" id="profiles-delete-btn" role="menuitem">Smazat</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="profiles-editor-wrap" id="profiles-editor-wrap">
                <textarea id="config-editor" spellcheck="false" placeholder="Vyber profil ze seznamu…" disabled></textarea>
            </div>
        </section>
    </div>
</div>
