# Výchozí konfig rmodus_web (blok web:).
# Launch ho předá jako robot_yaml; bringup ho přepíše
# aktivním robot profilem (configs/profiles/<active>.yaml).
#
# Stejné klíče jako ve vzoru: setup/examples/rmodus-example.yaml

web:
  # true  = vývojový režim (volnější autentizace ve websocketu)
  # false = ostrý provoz, přihlášení PINem je povinné
  testing: true

  # Kořen configs (install: ~/rmodus/configs). Prázdné = odvoď z --config
  # nebo $RMODUS_CONFIGS / ~/rmodus/configs.
  configs_root: ""

  # Adresa a port HTTP/WebSocket serveru (uvicorn).
  # 0.0.0.0 = poslouchá na všech rozhraních (Wi-Fi i Ethernet).
  host: "0.0.0.0"
  port: 8080
  log_level: info                  # uvicorn: critical|error|warning|info|debug|trace

  # PIN kódy UI (prostý text — chraňte práva souboru).
  # operator = ovládání robota, admin = správa uživatelů / nastavení
  operator_pin: "1234"
  admin_pin: "4321"

  tf:
    # Výchozí pevný rámec 3D scény TF (a kořen 2D stromu pro mapu)
    root_frame: base_link
    # Jak často posílat snímek TF do UI (Hz) – tf_2d i tf_3d
    broadcast_rate_hz: 5.0
    # Po této době bez /tf se strom považuje za zastaralý (s)
    stale_timeout_sec: 3.0
    # Minimální pauza mezi opětovným přihlášením k /tf při výpadku (s)
    resubscribe_cooldown_sec: 8.0
    # Stáří jednoho dynamického rámu: nad warn žlutý, nad error červený (s).
    # Statické rámy (/tf_static) nikdy nezastarávají.
    frame_stale_warn_sec: 0.5
    frame_stale_error_sec: 2.0

  topics:
    # Topic, které web odebírá / publikuje.
    # Mapa kreslí každý LaserScan (lidar: tady výběr neurčuje).
    # Jména bere z lidar.name / imu.name podle topicu.
    # Katalog Senzory objeví všechny LaserScan / Imu s publisherem.
    lidar: /scan
    imu: /imu/data
    bumper_prefix: /bumper/        # dynamicky se hledají /bumper/<jméno>
    cliff_prefix: /cliff/          # dynamicky se hledají /cliff/<jméno>
    flow_prefix: /visual_flow/     # dynamicky TwistWithCovarianceStamped (optický tok)
    map: /map
    map_updates: /map_updates
    plan: /received_global_plan
    goal_pose: /goal_pose
    cmd_vel: /web/cmd_vel          # joystick z UI = vstup web v cmd_mux
    e_stop_state: /rmodus/e_stop           # stav (true = stop aktivní)
    e_stop_request: /rmodus/e_stop/request # podnět k zastavení (UI tlačítko později)
    e_stop_reset: /rmodus/e_stop/reset     # podnět k resetu
    discovery_rate_hz: 1.0         # perioda discovery senzorů (lidar/imu/bumper/cliff/flow)

  sensors:
    # Max. frekvence živých dat jednoho senzoru do záložky Senzory (Hz).
    # Bumpery a cliff se neomezují (binární hrany). 0 = bez omezení.
    # Mapa dostává LaserScan dál v plné frekvenci.
    max_rate_hz: 10.0

  cmd:
    # false = geometry_msgs/Twist, true = geometry_msgs/TwistStamped
    # Musí sedět s cmd_mux.use_stamped v profilu.
    use_twist_stamped: false
    frame_id: base_link

  ui:
    # Ukládat UI preference v prohlížeči (localStorage): záložka, sidebar,
    # senzory, mapa, TF. false = vždy výchozí stav po refreshi.
    persist_local: true
    # Viditelnost záložek v levém menu (true = zobrazit, false = skrýt).
    nav_tabs:
      status: true
      controls: true
      map: true
      sensors: true
      tf: true
      docs: true
      config: true
      settings: true
      users: true
    # Widget "Robot Blueprint" (Senzory): obrys robota z base_link.size, segmenty
    # z bumpers/cliff_sensors (mount_offset, size, name). SVG id segmentu = name.
    # segments: přemapování / doplnění — svg_id: topic, nebo svg_id: {topic, x, y, yaw, size, threshold}
    # (x/y/yaw v base_link, m/rad; threshold = cliff dosah [m], nad ním je "schod").
    blueprint:
      segments: {}
      # segments:
      #   bumper_front: /bumper/front
      #   bumper_left: { topic: /platform/bumper_l, x: 0.0, y: 0.26, yaw: 1.5708, size: [0.02, 0.3] }
