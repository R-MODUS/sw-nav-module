<div class="page-shell sensors-page">
    <header class="sx-head">
        <h1 class="page-title">Senzory</h1>
        <div class="sx-chips">
            <span class="sx-chip">Zjištěno <strong data-role="count">0</strong></span>
            <span class="sx-chip">V přehledu <strong data-role="pinned-count">0</strong></span>
        </div>
        <div class="sx-head-actions">
            <button type="button" class="sx-btn" data-role="reset-layout" title="Vrátit výchozí rozmístění dlaždic">Obnovit rozložení</button>
        </div>
    </header>

    <div class="sx-layout">
        <aside class="sx-catalog" data-role="catalog" aria-label="Katalog senzorů">
            <div class="sx-catalog-head">
                <span class="sx-catalog-title">Katalog</span>
                <button type="button" class="sx-icon-btn" data-role="collapse" title="Sbalit / rozbalit katalog" aria-label="Sbalit katalog">‹</button>
            </div>
            <div class="sx-catalog-tools">
                <input type="search" class="sx-search" data-role="search" placeholder="Hledat senzor / topic…" aria-label="Hledat senzor">
                <div class="sx-catalog-actions">
                    <button type="button" class="sx-link-btn" data-role="pin-all">Vše</button>
                    <button type="button" class="sx-link-btn" data-role="pin-none">Nic</button>
                </div>
            </div>
            <div class="sx-tree" data-role="tree"></div>
        </aside>

        <section class="sx-dashboard" aria-label="Přehled senzorů">
            <div class="grid-stack sx-grid" data-role="grid"></div>
            <p class="sx-grid-empty" data-role="grid-empty">V katalogu vlevo zaškrtněte senzory, které chcete sledovat.</p>
        </section>
    </div>

    <aside class="sx-drawer" data-role="drawer" aria-hidden="true" aria-label="Detail senzoru">
        <header class="sx-drawer-head">
            <span class="sx-dot" data-role="dot"></span>
            <h2 data-role="title">Detail</h2>
            <span class="sx-badge" data-role="badge"></span>
            <button type="button" class="sx-icon-btn" data-role="close" title="Zavřít (Esc)" aria-label="Zavřít detail">×</button>
        </header>
        <div class="sx-drawer-body">
            <dl class="sx-meta" data-role="meta"></dl>
            <div class="sx-drawer-visual" data-role="visual"></div>
            <div class="sx-children" data-role="children" hidden></div>
            <div class="sx-metrics" data-role="metrics"></div>
            <div class="sx-raw-head">
                <span>Surová data</span>
                <button type="button" class="sx-link-btn" data-role="copy">Kopírovat</button>
            </div>
            <pre class="sx-raw" data-role="raw"></pre>
        </div>
    </aside>
</div>
